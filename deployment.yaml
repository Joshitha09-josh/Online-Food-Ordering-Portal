apiVersion: apps/v1
kind: Deployment
metadata:
  name: online-food-portal
spec:
  replicas: 3
  selector:
    matchLabels:
      app: online-food-portal
  template:
    metadata:
      labels:
        app: online-food-portal
    spec:
      containers:
        - name: online-food-portal
          image: balaji00002/online-food-portal:v2
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: online-food-portal-service
spec:
  type: NodePort
  selector:
    app: online-food-portal
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30084